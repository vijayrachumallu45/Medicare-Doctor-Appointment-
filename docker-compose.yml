version: '3.8'
services:
  mongodb:
    image: mongo:7.0
    container_name: medicare_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: medicare_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/medicare
      - JWT_SECRET=medicare_super_secret_jwt_key_2026
    depends_on:
      - mongodb

volumes:
  mongo_data:
